spring.application.name=personal-expense-tracker
server.port=8080

# ------------------------------------------------------------------------------
# Data Source Configuration
# Defaults to H2 in-memory for zero-friction setup and development.
# Overridable via DB_URL, DB_USER, DB_PASSWORD environment variables.
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:mem:expense_tracker_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Actuator Health Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
