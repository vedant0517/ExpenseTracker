spring.application.name=personal-expense-tracker
server.port=8080

# ------------------------------------------------------------------------------
# Data Source Configuration
# 1. Automatically imports local 'db.properties' if present (ignored by Git)
# 2. Can be overridden via DB_URL, DB_USER, DB_PASSWORD environment variables
# 3. Defaults to local MySQL (port 3306)
# ------------------------------------------------------------------------------
spring.config.import=optional:file:./db.properties

spring.datasource.url=${db.url:${DB_URL:jdbc:mysql://localhost:3306/expense_tracker_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}
spring.datasource.username=${db.user:${DB_USER:root}}
spring.datasource.password=${db.password:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${db.driver:${DB_DRIVER:com.mysql.cj.jdbc.Driver}}

# ------------------------------------------------------------------------------
# Flyway Database Migration
# Manages schema migrations across environments.
# ------------------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ------------------------------------------------------------------------------
# JPA & Hibernate Configuration
# Uses Hibernate validation to verify entity schema matches Flyway migrations
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# JWT Authentication Configuration
# Configurable via JWT_SECRET and JWT_EXPIRATION_MS environment variables.
# ------------------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET:c3VwZXJTZWNyZXRLZXlGb3JQZXJzb25hbEV4cGVuc2VUcmFja2VyMjAyNk11c3RCZUF0TGVhc3QyNTZCaXRzTG9uZw==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ------------------------------------------------------------------------------
# Monitoring & Actuator Configuration
# Minimal health details are exposed to unauthenticated callers.
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=false

# ------------------------------------------------------------------------------
# OpenAPI & Swagger UI Configuration
# ------------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
