spring.application.name=personal-expense-tracker-test

# ------------------------------------------------------------------------------
# Isolated In-Memory H2 for Unit & Integration Tests (MySQL Compatibility Mode)
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:expense_tracker_test_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

